name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: sallvat_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sallvat_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      SALLVAT_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=postgres;Username=sallvat_ci;Password=isolated-ci-only"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore frontend dependencies
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build Tailwind asset
        run: npm run css:build

      - name: Verify generated Tailwind asset
        run: git diff --exit-code -- src/Sallvat.Web/wwwroot/css/app.css

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Test documentation tooling
        run: npm run test:tooling

      - name: Restore .NET tools and packages
        run: |
          dotnet tool restore
          dotnet restore Sallvat.sln --locked-mode

      - name: Build
        run: dotnet build Sallvat.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Sallvat.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Verify formatting
        run: dotnet format Sallvat.sln --verify-no-changes --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list Sallvat.sln package --vulnerable --include-transitive

      - name: Build application container
        run: docker build --pull --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "sallvat-smoke:${GITHUB_SHA}" .

      - name: Smoke test application container
        run: bash tools/smoke-container.sh "sallvat-smoke:${GITHUB_SHA}"

      - name: Generate reviewed migration artifact
        env:
          ConnectionStrings__SallvatDatabase: 'Host=127.0.0.1;Port=1;Database=sallvat_script;Username=unused;Password=not-used'
        run: >-
          dotnet ef migrations script --idempotent --project src/Sallvat.Infrastructure
          --startup-project src/Sallvat.Web --configuration Release --no-build
          --output "${RUNNER_TEMP}/sallvat-migrations.sql" -- --environment Testing

      - name: Test VPS preparation tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_vps.py'

      - name: Smoke test private staging stack
        run: bash tools/smoke-staging.sh "sallvat-smoke:${GITHUB_SHA}" "${RUNNER_TEMP}/sallvat-migrations.sql"

      - name: Package validated VPS kit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tools/package-vps.py "sallvat-smoke:${GITHUB_SHA}" "${RUNNER_TEMP}/sallvat-migrations.sql" "${RUNNER_TEMP}/sallvat-vps"

      - name: Smoke test VPS operator procedure
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash tools/smoke-vps.sh "${RUNNER_TEMP}/sallvat-vps"

      - name: Upload private staging kit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sallvat-vps-${{ github.sha }}
          path: ${{ runner.temp }}/sallvat-vps/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  pages:
    name: Publish validated showcase
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
