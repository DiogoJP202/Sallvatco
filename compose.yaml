name: sallvat-development

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${SALLVAT_POSTGRES_DB:-sallvat}
      POSTGRES_USER: ${SALLVAT_POSTGRES_USER:-sallvat}
      POSTGRES_PASSWORD: ${SALLVAT_POSTGRES_PASSWORD:?Copy .env.example to .env and set SALLVAT_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - 127.0.0.1:${SALLVAT_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 1m
    shm_size: 128mb
    networks:
      - database

volumes:
  postgres-data:

networks:
  database:
    internal: true
