# Ensaio privado de Staging. Não combinar com o compose.yaml de Development.
name: sallvat-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  nginx:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    user: '101:101'
    entrypoint: ['/bin/sh', '/etc/sallvat/start-nginx.sh']
    environment:
      STAGING_HOST: ${STAGING_HOST:?Defina o host de homologacao}
    ports:
      - '127.0.0.1:${STAGING_HTTP_PORT:-8081}:8080'
      - '127.0.0.1:${STAGING_HTTPS_PORT:-8443}:8443'
    volumes:
      - ./nginx.conf.template:/etc/sallvat/nginx.conf.template:ro
      - ./start-nginx.sh:/etc/sallvat/start-nginx.sh:ro
    secrets:
      - tls_certificate
      - tls_key
      - access_passwords
    networks:
      edge: {}
      proxy:
        ipv4_address: ${STAGING_PROXY_IP:-172.29.240.2}
    depends_on:
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  web:
    image: ${SALLVAT_IMAGE:?Defina uma imagem aprovada por digest}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${STAGING_HOST:?Defina o host de homologacao}
      AccountLinks__PublicOrigin: https://${STAGING_HOST:?Defina o host de homologacao}
      ReverseProxy__Enabled: 'true'
      ReverseProxy__KnownProxy: ${STAGING_PROXY_IP:-172.29.240.2}
      Payments__MercadoPago__Enabled: 'false'
      Payments__MercadoPago__OrdersEnabled: 'false'
      Payments__MercadoPago__CheckoutEnabled: 'false'
      Payments__MercadoPago__WebhookEnabled: 'false'
      Payments__MercadoPago__RecoveryEnabled: 'false'
      Payments__MercadoPago__AutomaticRecoveryEnabled: 'false'
      Payments__MercadoPago__RefundPreparationEnabled: 'false'
      Payments__MercadoPago__RefundEnabled: 'false'
      Shipping__MelhorEnvio__Enabled: 'false'
    secrets:
      - source: application_settings
        target: /app/appsettings.Staging.json
    volumes:
      - keys:/var/lib/sallvat/keys
      - images:/var/lib/sallvat/images
    networks: [proxy, database]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: sallvat_staging
      POSTGRES_USER: sallvat_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/database_owner_password
    secrets:
      - database_owner_password
      - database_app_password
    volumes:
      - database:/var/lib/postgresql
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sallvat_owner -d sallvat_staging']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    logging: *logging

networks:
  edge: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${STAGING_PROXY_SUBNET:-172.29.240.0/28}
  database:
    internal: true

volumes:
  database: {}
  keys: {}
  images: {}

secrets:
  application_settings:
    file: ${STAGING_APPLICATION_SETTINGS:?Informe o JSON secreto da aplicacao}
  database_owner_password:
    file: ${STAGING_DB_OWNER_PASSWORD_FILE:?Informe a senha do owner em arquivo}
  database_app_password:
    file: ${STAGING_DB_APP_PASSWORD_FILE:?Informe a senha do runtime em arquivo}
  tls_certificate:
    file: ${STAGING_TLS_CERTIFICATE_FILE:?Informe o certificado PEM}
  tls_key:
    file: ${STAGING_TLS_KEY_FILE:?Informe a chave PEM}
  access_passwords:
    file: ${STAGING_ACCESS_PASSWORDS_FILE:?Informe o htpasswd de homologacao}
